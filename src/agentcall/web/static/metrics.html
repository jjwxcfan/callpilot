<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CallPilot 指标看板</title>
<style>
  /* 只读看板（WIL-95 第四期）：消费 /api/metrics/summary，零外部依赖。 */
  :root { --bg:#12141a; --card:#1c2028; --fg:#e6e8ee; --dim:#8a90a0;
          --line:#2a2f3a; --ok:#4caf7d; --warn:#e0a458; --bad:#e06c5c; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:15px; margin:20px 0 8px; color:var(--fg); }
  .dim { color:var(--dim); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:8px; padding:12px 14px; margin:10px 0; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--line);
          white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .na { color:var(--dim); }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px;
          background:var(--line); margin:0 6px 4px 0; font-size:12px; }
  .review-item { border-top:1px solid var(--line); padding:8px 0; }
  .review-item:first-child { border-top:none; }
  button { background:var(--line); color:var(--fg); border:1px solid #3a4150;
           border-radius:6px; padding:3px 12px; margin-right:6px; cursor:pointer; }
  button:hover { background:#343b48; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  #err { color:var(--bad); }
</style>
</head>
<body>
<h1>指标看板 <span class="dim">WIL-95 · 逐 schema 版本出数，版本间不平均</span></h1>
<div id="err"></div>
<div id="root" class="dim">加载中…</div>
<script>
"use strict";
const LAT_LABELS = {
  local_response_latency_ms: "本机应答（音尾→首块回复）",
  first_audio_delta_ms: "判停→首音频（生成）",
  playout_backlog_ms: "播出积压（体感主因）",
  tool_call_latency_ms: "工具调用耗时",
  first_audio_ms: "整通首音频（greeting→到达）",
  hangup_latency_ms: "挂断时延（末条对话事件→结束）",
};
const CONCLUSION_LABELS = {
  achieved: "达成", not_achieved: "未达成",
  objectively_unreachable: "客观不可达", uncertain: "不确定",
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function statRow(name, s) {
  if (!s) return `<tr><td>${esc(name)}</td><td colspan="4" class="na">无样本</td></tr>`;
  return `<tr><td>${esc(name)}</td><td>${s.n}</td><td>${s.p50}</td>` +
         `<td>${s.p95}</td><td>${s.max}</td></tr>`;
}

function renderVersion(v, d) {
  let html = `<div class="card"><h2>schema v${esc(v)} · ${d.calls} 通</h2>`;
  for (const [dir, g] of Object.entries(d.directions)) {
    html += `<h2>${esc(dir)}（${g.calls} 通）</h2>
      <table><tr><th>指标（ms）</th><th>n</th><th>p50</th><th>p95</th><th>max</th></tr>`;
    const rows = {...g.latency, first_audio_ms: g.first_audio_ms,
                  hangup_latency_ms: g.hangup_latency_ms};
    for (const [f, s] of Object.entries(rows))
      html += statRow(LAT_LABELS[f] || f, s);
    html += `</table>`;
  }
  html += `<div style="margin-top:10px">`;
  for (const [k, n] of Object.entries(d.terminations || {}))
    html += `<span class="pill">终止·${esc(k)}: ${n}</span>`;
  const c = d.contact_known || {};
  if (c.known || c.unknown)
    html += `<span class="pill">熟人 ${c.known}/${c.known + c.unknown}</span>`;
  for (const [combo, n] of Object.entries(d.config_combos || {}))
    html += `<span class="pill">${esc(combo)}: ${n}</span>`;
  if (d.barge_in_fallback_calls)
    html += `<span class="pill bad">自激兜底触发 ${d.barge_in_fallback_calls} 通</span>`;
  return html + `</div></div>`;
}

function renderReview(review, verdicts) {
  let html = `<div class="card"><h2>判官裁决 · 共 ${verdicts.total} 通`;
  for (const [k, n] of Object.entries(verdicts.conclusions || {}))
    html += ` <span class="pill">${esc(CONCLUSION_LABELS[k] || k)}: ${n}</span>`;
  for (const [k, n] of Object.entries(verdicts.labels || {}))
    html += ` <span class="pill ok">已标注·${esc(k)}: ${n}</span>`;
  html += `</h2>`;
  if (!review.length) {
    html += `<div class="dim">复核队列为空 🎉</div>`;
  } else {
    html += `<div class="dim">待人工复核 ${review.length} 通——标注即地面真值，`
          + `攒起来就是判官的回归测试集</div>`;
    for (const r of review) {
      html += `<div class="review-item" data-call="${esc(r.call_id)}">
        <div><b>${esc(r.call_id)}</b>
          <span class="warn">${esc(CONCLUSION_LABELS[r.conclusion] || r.conclusion)}</span>
          <span class="dim">置信 ${r.confidence ?? "-"} · 入队原因 ${esc(r.review_reason)}</span></div>
        <div class="dim">${esc(r.reasons || "")}</div>
        <div style="margin-top:4px">
          <button onclick="label('${esc(r.call_id)}','correct')">判得对</button>
          <button onclick="label('${esc(r.call_id)}','wrong')">判错了</button>
          <button onclick="label('${esc(r.call_id)}','unsure')">看不出</button>
        </div></div>`;
    }
  }
  return html + `</div>`;
}

async function label(callId, value) {
  try {
    const res = await fetch("/api/metrics/label", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({call_id: callId, label: value}),
    });
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    document.querySelector(`[data-call="${CSS.escape(callId)}"]`)?.remove();
  } catch (e) { document.getElementById("err").textContent = "标注失败：" + e; }
}

async function load() {
  try {
    const res = await fetch("/api/metrics/summary");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const s = data.summary;
    let html = `<div class="dim">通话 ${s.calls_analyzed} 通（跳过 ${s.calls_skipped} 通无指标）</div>`;
    if (!s.calls_analyzed && !data.verdicts.total)
      html += `<div class="card dim">还没有数据——合入 main 并打第一通电话后，这里会长出来。</div>`;
    for (const [v, d] of Object.entries(s.schema_versions))
      html += renderVersion(v, d);
    html += renderReview(data.review, data.verdicts);
    document.getElementById("root").innerHTML = html;
    document.getElementById("root").classList.remove("dim");
  } catch (e) {
    document.getElementById("err").textContent = "加载失败：" + e;
  }
}
load();
</script>
</body>
</html>
